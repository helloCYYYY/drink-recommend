<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>今天想喝点什么呀 💕</title>
<style>
  :root{
    --rose:#3b82f6;
    --rose-deep:#2563eb;
    --peach:#7dd3fc;
    --ink:#26384a;
    --ink-soft:#73889c;
    --card:rgba(255,255,255,.72);
    --card-strong:rgba(255,255,255,.92);
    --line:rgba(59,130,246,.18);
    --radius:22px;
    --shadow:0 10px 30px rgba(59,130,246,.20);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
    background:linear-gradient(160deg,#e6f0ff 0%,#e0ecff 40%,#d8e6ff 100%);
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;
    min-height:100dvh;
    padding:24px;
  }

  /* ===== 设备外壳（桌面预览用，手机上自动满屏） ===== */
  .phone{
    width:402px;max-width:100%;height:874px;max-height:92vh;
    background:#1c1620;
    border-radius:54px;
    padding:13px;
    box-shadow:0 30px 80px rgba(120,40,70,.35);
    position:relative;
  }
  .screen{
    width:100%;height:100%;
    background:linear-gradient(160deg,#f2f7ff 0%,#e9f1ff 45%,#dcebff 100%);
    border-radius:42px;
    overflow:hidden;position:relative;
    display:flex;flex-direction:column;
  }
  /* 灵动岛 */
  .notch{
    position:absolute;top:11px;left:50%;transform:translateX(-50%);
    width:108px;height:30px;background:#1c1620;border-radius:18px;z-index:50;
  }
  @media (max-width:480px){
    body{padding:0;background:#dcebff;}
    .phone{width:100%;height:100vh;height:100dvh;max-height:none;border-radius:0;padding:0;box-shadow:none;}
    .screen{border-radius:0;}
    .notch{display:none;}
  }

  /* ===== 内容区 ===== */
  .scroll{flex:1;overflow-y:auto;padding:max(54px,env(safe-area-inset-top)) 20px max(120px,calc(120px + env(safe-area-inset-bottom)));-webkit-overflow-scrolling:touch;}
  .header{padding:6px 4px 14px;}
  .header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .header-copy{min-width:0;}
  .header h1{font-size:23px;margin:0 0 4px;font-weight:800;letter-spacing:0;}
  .header p{margin:0;font-size:13px;color:var(--ink-soft);}
  .quick-actions{display:flex;gap:6px;flex:none;}
  .icon-btn{
    width:38px;height:38px;border:1px solid var(--line);border-radius:12px;background:var(--card-strong);
    color:var(--ink);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 12px rgba(59,130,246,.10);
  }
  .icon-btn:active{transform:scale(.94);}
  .icon-btn:focus-visible,.cat:focus-visible,.brand:focus-visible,.sku-select:focus-visible,.chip:focus-visible{
    outline:3px solid rgba(37,99,235,.35);outline-offset:2px;
  }

  .progress{display:flex;align-items:center;gap:8px;margin:18px 2px 6px;}
  .progress .dot{width:9px;height:9px;border-radius:50%;background:rgba(59,130,246,.25);transition:.3s;}
  .progress .dot.on{background:var(--rose);transform:scale(1.25);}
  .progress .bar{flex:1;height:3px;border-radius:3px;background:rgba(59,130,246,.18);overflow:hidden;}
  .progress .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--peach),var(--rose));transition:.4s;}

  .section{margin-top:22px;}
  .section .ttl{font-size:13px;color:var(--ink-soft);margin:0 4px 10px;font-weight:600;display:flex;align-items:center;gap:6px;}
  .section.hidden{display:none;}

  /* 大类卡片 */
  .cats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .cat{
    background:var(--card);border:2px solid transparent;border-radius:var(--radius);
    padding:18px 8px;text-align:center;cursor:pointer;transition:.22s;backdrop-filter:blur(8px);
    box-shadow:0 6px 16px rgba(59,130,246,.10);color:inherit;font:inherit;width:100%;
  }
  .cat .emo{font-size:34px;display:block;margin-bottom:8px;}
  .cat .nm{font-size:14px;font-weight:700;}
  .cat:active{transform:scale(.95);}
  .cat.sel{border-color:var(--rose);background:var(--card-strong);box-shadow:var(--shadow);transform:translateY(-2px);}

  /* 品牌 */
  .brands{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .brand{
    background:var(--card);border:2px solid transparent;border-radius:18px;padding:16px 12px;
    cursor:pointer;transition:.22s;display:flex;align-items:center;gap:10px;backdrop-filter:blur(8px);
    box-shadow:0 6px 16px rgba(59,130,246,.10);color:inherit;font:inherit;width:100%;text-align:left;
  }
  .brand .logo{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;font-weight:800;flex:none;overflow:hidden;}
  .brand .bn{font-size:15px;font-weight:700;}
  .brand:active{transform:scale(.96);}
  .brand.sel{border-color:var(--rose);background:var(--card-strong);box-shadow:var(--shadow);}

  /* SKU 列表 */
  .skus{display:flex;flex-direction:column;gap:11px;}
  .sku{
    background:var(--card-strong);border-radius:18px;padding:14px 16px;transition:.2s;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    box-shadow:0 6px 16px rgba(59,130,246,.10);border:2px solid transparent;
    color:inherit;font:inherit;width:100%;text-align:left;
  }
  .sku-select{display:flex;align-items:center;gap:10px;min-width:0;flex:1;border:0;background:transparent;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer;}
  .sku-select:active{transform:scale(.98);}
  .sku .left{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;}
  .sku .thumb{width:46px;height:46px;border-radius:14px;object-fit:cover;flex:none;box-shadow:0 4px 10px rgba(59,130,246,.22);}
  .sku .sn{font-size:15px;font-weight:700;}
  .sku .tags{display:flex;gap:6px;flex-wrap:wrap;}
  .sku .tag{font-size:11px;color:var(--rose-deep);background:rgba(59,130,246,.12);padding:2px 8px;border-radius:20px;}
  .sku .price{font-size:16px;font-weight:800;color:var(--rose-deep);white-space:nowrap;}
  .sku .price small{font-size:11px;font-weight:600;opacity:.7;}
  .sku-actions{display:flex;align-items:center;gap:8px;flex:none;}
  .heart{
    width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--rose-deep);
    font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;
  }
  .heart.on{background:rgba(59,130,246,.12);border-color:var(--rose);}

  /* 底部操作条 */
  .footer{
    position:absolute;left:13px;right:13px;bottom:max(13px,env(safe-area-inset-bottom));
    background:var(--card-strong);backdrop-filter:blur(14px);
    border-radius:24px;padding:12px;box-shadow:0 10px 30px rgba(59,130,246,.25);
    display:flex;gap:10px;align-items:center;
  }
  .surprise{
    flex:1;border:none;border-radius:16px;padding:14px;font-size:15px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,var(--peach),var(--rose));
    cursor:pointer;transition:.2s;box-shadow:0 6px 16px rgba(59,130,246,.4);
    display:flex;align-items:center;justify-content:center;gap:7px;
  }
  .surprise:active{transform:scale(.97);}
  .mini-reset{
    border:2px solid var(--line);background:transparent;border-radius:16px;padding:14px 16px;
    font-size:14px;font-weight:700;color:var(--ink-soft);cursor:pointer;
  }
  .mini-reset:active{transform:scale(.97);}

  /* 结果弹层 */
  .overlay{
    position:absolute;inset:0;background:rgba(40,18,30,.45);backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;z-index:80;padding:30px;
  }
  .overlay.show{display:flex;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .result{
    background:#fff;border-radius:30px;padding:30px 26px;text-align:center;max-width:330px;width:100%;
    box-shadow:0 20px 60px rgba(120,40,70,.4);animation:pop .35s cubic-bezier(.2,1.2,.4,1);
  }
  @keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
  .result .ribbon{font-size:13px;color:var(--rose-deep);font-weight:700;letter-spacing:1px;}
  .result .big{font-size:40px;margin:10px 0 4px;}
  .result .rname{font-size:24px;font-weight:800;margin:6px 0;}
  .result .rmeta{font-size:14px;color:var(--ink-soft);margin-bottom:6px;}
  .result .rprice{font-size:22px;font-weight:800;color:var(--rose-deep);margin:8px 0 14px;}
  .result .rtags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:18px;}
  .result .rtag{font-size:12px;color:var(--rose-deep);background:rgba(59,130,246,.12);padding:4px 12px;border-radius:20px;}
  .result .close{
    width:100%;border:none;border-radius:16px;padding:14px;font-size:15px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,var(--peach),var(--rose));cursor:pointer;
  }
  .result .close:active{transform:scale(.97);}

  /* 定制面板（温度/甜度/加料） */
  .custom{
    background:#fff;border-radius:30px;padding:26px 22px;max-width:340px;width:100%;
    box-shadow:0 20px 60px rgba(120,40,70,.4);animation:pop .35s cubic-bezier(.2,1.2,.4,1);
    max-height:84%;overflow-y:auto;
  }
  .custom .ctitle{font-size:21px;font-weight:800;margin:0 0 2px;}
  .custom .cmeta{font-size:13px;color:var(--ink-soft);margin-bottom:6px;}
  .optgroup{margin:16px 0 0;}
  .optgroup .glabel{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:9px;display:flex;align-items:center;gap:6px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    border:2px solid var(--line);background:transparent;border-radius:20px;padding:7px 15px;
    font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:.16s;-webkit-tap-highlight-color:transparent;
  }
  .chip:active{transform:scale(.94);}
  .chip.on{border-color:var(--rose);color:var(--rose-deep);background:rgba(59,130,246,.12);font-weight:700;}
  .custom .confirm{
    width:100%;border:none;border-radius:16px;padding:14px;margin-top:22px;font-size:15px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,var(--peach),var(--rose));cursor:pointer;box-shadow:0 6px 16px rgba(59,130,246,.4);
  }
  .custom .confirm:active{transform:scale(.97);}
  /* 结果里的参数展示 */
  .result .rparams{font-size:14px;color:var(--ink);background:rgba(59,130,246,.08);border-radius:14px;padding:11px 13px;margin:4px 0 14px;line-height:1.7;text-align:left;}

  /* 搜索、收藏与最近记录 */
  .panel{
    background:#fff;border-radius:26px;padding:22px;max-width:360px;width:100%;max-height:88%;overflow-y:auto;
    box-shadow:0 20px 60px rgba(40,60,90,.35);animation:pop .25s cubic-bezier(.2,1.1,.4,1);
  }
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;}
  .panel-title{font-size:20px;font-weight:800;margin:0;}
  .panel-close{border:0;background:transparent;width:36px;height:36px;font-size:24px;color:var(--ink-soft);cursor:pointer;}
  .search-input{
    width:100%;height:46px;border:2px solid var(--line);border-radius:14px;padding:0 14px;font-size:15px;
    color:var(--ink);background:#fff;outline:none;
  }
  .search-input:focus{border-color:var(--rose);box-shadow:0 0 0 3px rgba(59,130,246,.12);}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0 14px;}
  .filters select{
    min-width:0;height:40px;border:1px solid var(--line);border-radius:12px;padding:0 9px;background:#f8fbff;
    color:var(--ink);font-size:13px;
  }
  .result-count{font-size:12px;color:var(--ink-soft);margin:0 2px 10px;}
  .panel-list{display:flex;flex-direction:column;gap:9px;}
  .panel-list .sku{padding:11px 12px;border-radius:14px;}
  .panel-list .sku .thumb{width:42px;height:42px;border-radius:11px;}
  .panel-list .sku .sn{font-size:14px;}
  .drink-meta{font-size:11px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .segments{display:grid;grid-template-columns:1fr 1fr;background:#eef4ff;border-radius:12px;padding:3px;margin-bottom:14px;}
  .segment{border:0;border-radius:9px;padding:9px;background:transparent;color:var(--ink-soft);font-weight:700;cursor:pointer;}
  .segment.on{background:#fff;color:var(--rose-deep);box-shadow:0 2px 8px rgba(59,130,246,.12);}
  .empty{padding:42px 14px;text-align:center;color:var(--ink-soft);font-size:14px;line-height:1.7;}
  .clear-history{display:none;margin:14px auto 0;border:0;background:transparent;color:var(--ink-soft);font-size:12px;cursor:pointer;}
  .result-actions{display:flex;gap:9px;align-items:center;}
  .result-actions .close{flex:1;}
  .result-actions .heart{width:46px;height:46px;border-radius:16px;font-size:23px;}
  .result-actions .close:disabled{opacity:.55;cursor:wait;}
  .share-status{min-height:18px;margin:9px 0 0;font-size:12px;color:var(--ink-soft);}
  .again{
    border:0;background:transparent;color:var(--ink-soft);font-size:13px;font-weight:700;
    padding:9px 12px 0;cursor:pointer;
  }

  /* 撒花 */
  .confetti{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:90;}
  .confetti span{position:absolute;top:-30px;font-size:22px;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(900px) rotate(360deg);opacity:.2;}}
</style>
</head>
<body>
  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <div class="scroll">
        <div class="header">
          <div class="header-top">
            <div class="header-copy">
              <h1>今天想喝点什么呀 💕</h1>
              <p id="sub">先选个大类，我帮你挑～</p>
            </div>
            <div class="quick-actions">
              <button class="icon-btn" id="searchBtn" type="button" title="搜索饮品" aria-label="搜索饮品">🔍</button>
              <button class="icon-btn" id="libraryBtn" type="button" title="收藏与最近" aria-label="收藏与最近">♡</button>
            </div>
          </div>
        </div>

        <div class="progress">
          <div class="dot" id="d1"></div>
          <div class="bar"><i id="bar"></i></div>
          <div class="dot" id="d2"></div>
          <div class="bar"><i id="bar2"></i></div>
          <div class="dot" id="d3"></div>
        </div>

        <!-- 大类 -->
        <div class="section" id="secCat">
          <p class="ttl">① 选大类</p>
          <div class="cats" id="cats"></div>
        </div>

        <!-- 品牌 -->
        <div class="section hidden" id="secBrand">
          <p class="ttl">② 选品牌</p>
          <div class="brands" id="brands"></div>
        </div>

        <!-- SKU -->
        <div class="section hidden" id="secSku">
          <p class="ttl">③ 选具体饮品</p>
          <div class="skus" id="skus"></div>
        </div>
      </div>

      <div class="footer">
        <button class="surprise" id="surpriseBtn">🎲 随机惊喜</button>
        <button class="mini-reset" id="resetBtn">重选</button>
      </div>

      <div class="overlay" id="overlay">
        <div class="result" id="resultCard"></div>
      </div>
      <div class="overlay" id="customOverlay">
        <div class="custom" id="customCard"></div>
      </div>
      <div class="overlay" id="searchOverlay">
        <div class="panel" role="dialog" aria-modal="true" aria-labelledby="searchTitle">
          <div class="panel-head"><h2 class="panel-title" id="searchTitle">搜索饮品</h2><button class="panel-close" id="closeSearchBtn" type="button" aria-label="关闭">×</button></div>
          <input class="search-input" id="searchInput" type="search" placeholder="饮品名称或品牌" autocomplete="off" />
          <div class="filters">
            <select id="filterCat" aria-label="品类筛选"></select>
            <select id="filterBrand" aria-label="品牌筛选"></select>
            <select id="filterPrice" aria-label="最高价格">
              <option value="">不限价格</option><option value="15">¥15以内</option><option value="20">¥20以内</option><option value="30">¥30以内</option>
            </select>
            <select id="filterSort" aria-label="排序方式">
              <option value="default">默认排序</option><option value="priceAsc">价格从低到高</option><option value="priceDesc">价格从高到低</option>
            </select>
          </div>
          <p class="result-count" id="searchCount"></p>
          <div class="panel-list" id="searchResults"></div>
        </div>
      </div>
      <div class="overlay" id="libraryOverlay">
        <div class="panel" role="dialog" aria-modal="true" aria-labelledby="libraryTitle">
          <div class="panel-head"><h2 class="panel-title" id="libraryTitle">我的饮品</h2><button class="panel-close" id="closeLibraryBtn" type="button" aria-label="关闭">×</button></div>
          <div class="segments" role="tablist">
            <button class="segment on" id="favoritesTab" type="button" role="tab" aria-selected="true">收藏</button>
            <button class="segment" id="historyTab" type="button" role="tab" aria-selected="false">最近</button>
          </div>
          <div class="panel-list" id="libraryList"></div>
          <button class="clear-history" id="clearHistoryBtn" type="button">清空最近记录</button>
        </div>
      </div>
      <div class="confetti" id="confetti"></div>
    </div>
  </div>

<!-- 数据来自外部 data.js，改 SKU 只要编辑那个文件 -->
<script src="data.js"></script>
<script>
const state = {cat:null, brand:null};
const $ = id => document.getElementById(id);
const STORAGE = { favorites:'drink-favorites-v1', history:'drink-history-v1' };

function readList(key){
  try{
    const value=JSON.parse(localStorage.getItem(key) || '[]');
    return Array.isArray(value) ? value : [];
  }catch(_){ return []; }
}
function writeList(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(_){}
}
function drinkKey(catKey, brandKey, s){
  return JSON.stringify([catKey, brandKey, s.name, s.price, s.img || '']);
}
function catalogEntries(){
  const entries=[];
  Object.entries(DATA).forEach(([catKey,cat])=>{
    Object.entries(cat.brands).forEach(([brandKey,brand])=>{
      brand.skus.forEach(s=>entries.push({
        s, catKey, brandKey, catLabel:cat.label, brandName:brand.name,
        key:drinkKey(catKey, brandKey, s)
      }));
    });
  });
  return entries;
}
const catalog=catalogEntries();
const catalogByKey=new Map(catalog.map(entry=>[entry.key,entry]));
const favorites=new Set(readList(STORAGE.favorites).filter(key=>catalogByKey.has(key)));
let history=readList(STORAGE.history).filter(key=>catalogByKey.has(key)).slice(0,30);
let recentRandom=[];

function toggleFavorite(key){
  if(favorites.has(key)) favorites.delete(key); else favorites.add(key);
  writeList(STORAGE.favorites,[...favorites]);
  updateLibraryIcon();
  render();
  if($('searchOverlay').classList.contains('show')) renderSearchResults();
  if($('libraryOverlay').classList.contains('show')) renderLibrary();
  if(activeResult) renderResultCard();
}
function recordHistory(key){
  history=[key,...history.filter(item=>item!==key)].slice(0,30);
  writeList(STORAGE.history,history);
}
function updateLibraryIcon(){
  $('libraryBtn').textContent=favorites.size?'♥':'♡';
  $('libraryBtn').title=favorites.size?`收藏与最近（${favorites.size}）`:'收藏与最近';
}
function renderDrinkRow(entry, showMeta=false){
  const {s,key}=entry;
  const el=document.createElement('div');
  el.className='sku';
  const select=document.createElement('button');
  select.type='button';select.className='sku-select';
  select.setAttribute('aria-label',`选择${s.name}`);
  const thumb=s.img?`<img class="thumb" src="${s.img}" alt="" loading="lazy">`:'';
  const tags=s.tags && s.tags.length ? `<div class="tags">${s.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>` : '';
  const meta=showMeta?`<div class="drink-meta">${entry.catLabel} · ${entry.brandName}</div>`:'';
  select.innerHTML=`${thumb}<div class="left"><div class="sn">${s.name}</div>${meta}${tags}</div><div class="price"><small>¥</small>${s.price}</div>`;
  select.onclick=()=>{
    closeSearch();closeLibrary();
    openCustom(s,entry.catKey,entry.catLabel,entry.brandName,entry.brandKey);
  };
  const heart=document.createElement('button');
  heart.type='button';heart.className='heart'+(favorites.has(key)?' on':'');
  heart.textContent=favorites.has(key)?'♥':'♡';
  heart.title=favorites.has(key)?'取消收藏':'收藏';
  heart.setAttribute('aria-label',heart.title+s.name);
  heart.onclick=()=>toggleFavorite(key);
  el.append(select,heart);
  return el;
}

function render(){
  // 大类
  const cats = $('cats');
  cats.innerHTML = '';
  Object.entries(DATA).forEach(([k,v])=>{
    const el = document.createElement('button');
    el.type='button';
    el.className = 'cat' + (state.cat===k?' sel':'');
    el.innerHTML = `<span class="emo">${v.emoji || v.emo}</span><span class="nm">${v.label}</span>`;
    el.onclick = ()=>pickCat(k);
    cats.appendChild(el);
  });

  // 品牌
  if(state.cat){
    $('secBrand').classList.remove('hidden');
    const brands = $('brands');
    brands.innerHTML='';
    Object.entries(DATA[state.cat].brands).forEach(([k,v])=>{
      const el=document.createElement('button');
      el.type='button';
      el.className='brand'+(state.brand===k?' sel':'');
      const logoHtml = v.logoImg ? `<img src="${v.logoImg}" alt="${v.name}" style="width:100%;height:100%;object-fit:cover">` : v.logo;
      el.innerHTML=`<div class="logo" style="background:linear-gradient(135deg,var(--peach),var(--rose))">${logoHtml}</div><div class="bn">${v.name}</div>`;
      el.onclick=()=>pickBrand(k);
      brands.appendChild(el);
    });
  } else {
    $('secBrand').classList.add('hidden');
  }

  // SKU
  if(state.cat && state.brand){
    $('secSku').classList.remove('hidden');
    const skus = $('skus');
    skus.innerHTML='';
    const brand=DATA[state.cat].brands[state.brand];
    brand.skus.forEach(s=>skus.appendChild(renderDrinkRow({
      s,catKey:state.cat,brandKey:state.brand,catLabel:DATA[state.cat].label,brandName:brand.name,
      key:drinkKey(state.cat,state.brand,s)
    })));
  } else {
    $('secSku').classList.add('hidden');
  }

  // 进度 & 副标题
  $('d1').classList.toggle('on', !!state.cat);
  $('d2').classList.toggle('on', !!state.brand);
  $('d3').classList.toggle('on', !!state.brand);
  $('bar').style.width = state.cat?'100%':'0';
  $('bar2').style.width = state.brand?'100%':'0';

  let sub='先选个大类，我帮你挑～';
  if(state.cat && state.brand) sub=`${DATA[state.cat].label} · ${DATA[state.cat].brands[state.brand].name}，挑一杯吧 ✨`;
  else if(state.cat) sub=`已选 ${DATA[state.cat].label}，再选个品牌 💕`;
  $('sub').textContent=sub;
}

function pickCat(k){
  state.cat=k;
  if(state.brand && !DATA[k].brands[state.brand]) state.brand=null;
  render();
}
function pickBrand(k){ state.brand=k; render(); }

// 参数解析：每杯在 s.opts 里自己定义参数组。
// 某杯没有 opts（或没有合法组）=> 无参数，点它直接出结果、不弹面板。
// 返回 {label,items,multi} 或 false（无此组）
function resolveGroup(s, key){
  const o = s.opts;
  if(!o || !o[key]) return false;
  const g = o[key];
  if(!g.items || !Array.isArray(g.items) || g.items.length===0) return false;
  return { label: g.label || key, multi: !!g.multi, items: g.items };
}
// 某杯可用的参数组（按定义顺序）
function groupsFor(s){
  const o = s.opts;
  if(!o) return [];
  return Object.keys(o).filter(k=> resolveGroup(s, k) !== false);
}
const ICONS = { temp:'🌡️', sugar:'🍯', size:'🥤', strength:'☕', topping:'➕', ice:'❄️', milk:'🥛', spice:'🌶️' };
function groupIcon(k){ return ICONS[k] || '•'; }

let custom = null; // {s, catKey, catLabel, brandKey, brandName, sel:{}}
let activeResult = null;
let activeShareFile = null;
let shareStatus = '';
let shareGeneration = 0;

function openCustom(s, catKey, catLabel, brandName, brandKey){
  if(groupsFor(s).length === 0){            // 这杯没参数，直接出结果
    showResult(s, catLabel, brandName, false, null, catKey, brandKey);
    return;
  }
  custom = { s, catKey, catLabel, brandKey, brandName, sel:{} };
  groupsFor(s).forEach(k=>{
    const g = resolveGroup(s, k);
    custom.sel[k] = g.multi ? [] : g.items[0]; // 默认：单选取第一项，多选为空
  });
  renderCustom();
  $('customOverlay').classList.add('show');
}

function renderCustom(){
  const {s, catKey, catLabel, brandName} = custom;
  let groupsHtml = '';
  groupsFor(s).forEach(k=>{
    const g = resolveGroup(s, k);
    const chips = g.items.map(it=>{
      const on = g.multi ? custom.sel[k].includes(it) : custom.sel[k]===it;
      return `<span class="chip${on?' on':''}" data-k="${k}" data-it="${it}" data-multi="${g.multi?1:0}">${it}</span>`;
    }).join('');
    groupsHtml += `<div class="optgroup"><div class="glabel">${groupIcon(k)} ${g.label}</div><div class="chips">${chips}</div></div>`;
  });
  $('customCard').innerHTML = `
    <div class="ctitle">${s.name}</div>
    <div class="cmeta">${catLabel} · ${brandName} · ¥${s.price}</div>
    ${groupsHtml}
    <button class="confirm" id="confirmBtn">确认 ✅</button>
  `;
  $('customCard').querySelectorAll('.chip').forEach(ch=>{
    ch.onclick = ()=>{
      const k=ch.dataset.k, it=ch.dataset.it, multi=ch.dataset.multi==='1';
      if(multi){
        const arr=custom.sel[k];
        const i=arr.indexOf(it);
        if(i>=0) arr.splice(i,1); else arr.push(it);
      } else {
        custom.sel[k]=it;
      }
      renderCustom();
    };
  });
  $('confirmBtn').onclick = confirmCustom;
}

function confirmCustom(){
  const {s, catKey, catLabel, brandKey, brandName, sel} = custom;
  $('customOverlay').classList.remove('show');
  showResult(s, catLabel, brandName, false, sel, catKey, brandKey);
}
function closeCustom(){ $('customOverlay').classList.remove('show'); }

function showResult(s, catLabel, brandName, isSurprise, params, catKey, brandKey){
  const key=drinkKey(catKey,brandKey,s);
  activeResult={s,catLabel,brandName,isSurprise,params,catKey,brandKey,key};
  activeShareFile=null;
  shareStatus='正在准备分享卡片…';
  const generation=++shareGeneration;
  recordHistory(key);
  renderResultCard();
  $('overlay').classList.add('show');
  if(isSurprise) burst();
  prepareShareCard(activeResult).then(file=>{
    if(generation!==shareGeneration) return;
    activeShareFile=file;
    shareStatus='';
    renderResultCard();
  }).catch(()=>{
    if(generation!==shareGeneration) return;
    shareStatus='图片生成失败，仍可复制订单文字';
    renderResultCard();
  });
}

function renderResultCard(){
  if(!activeResult) return;
  const {s,catLabel,brandName,isSurprise,params,key}=activeResult;
  const card=$('resultCard');
  const shareAvailable=!!activeShareFile || shareStatus.startsWith('图片生成失败');
  const shareLabel=activeShareFile?'发给你 💌':(shareAvailable?'复制订单文字':'准备分享卡片…');
  const bigHtml = s.img
    ? `<img src="${s.img}" alt="${s.name}" style="width:96px;height:96px;border-radius:24px;object-fit:cover;margin:8px auto;display:block;box-shadow:0 10px 24px rgba(59,130,246,.25)">`
    : `<div class="big">${DATA_emo(catLabel)}</div>`;
  // 参数展示
  let paramsHtml='';
  if(params){
    const parts=[];
    groupsFor(s).forEach(k=>{
      const g = resolveGroup(s, k);
      const sel=params[k];
      if(sel===undefined) return;
      let val;
      if(Array.isArray(sel)){ if(sel.length===0) return; val=sel.join('、'); }
      else val=sel;
      parts.push(`${groupIcon(k)} ${g.label}：${val}`);
    });
    if(parts.length) paramsHtml=`<div class="rparams">${parts.join('<br>')}</div>`;
  }
  card.innerHTML=`
    <div class="ribbon">${isSurprise?'🎉 随机惊喜 · 命中':'💖 为你挑好啦'}</div>
    ${bigHtml}
    <div class="rname">${s.name}</div>
    <div class="rmeta">${catLabel} · ${brandName}</div>
    <div class="rprice">¥${s.price}</div>
    ${paramsHtml}
    <div class="rtags">${s.tags.map(t=>`<span class="rtag">${t}</span>`).join('')}</div>
    <div class="result-actions">
      <button class="heart${favorites.has(key)?' on':''}" id="resultHeart" type="button" aria-label="${favorites.has(key)?'取消收藏':'收藏'}${s.name}">${favorites.has(key)?'♥':'♡'}</button>
      <button class="close" id="shareBtn" type="button" ${shareAvailable?'':'disabled'}>${shareLabel}</button>
    </div>
    <div class="share-status" role="status">${shareStatus}</div>
    <button class="again" type="button" onclick="closeResult()">再选一杯</button>
  `;
  $('resultHeart').onclick=()=>toggleFavorite(key);
  $('shareBtn').onclick=shareResultCard;
}

function parameterLines(s, params){
  if(!params) return [];
  const lines=[];
  groupsFor(s).forEach(k=>{
    const g=resolveGroup(s,k);
    const selected=params[k];
    if(selected===undefined) return;
    const value=Array.isArray(selected)?selected.join('、'):selected;
    if(value) lines.push(`${g.label}：${value}`);
  });
  return lines;
}
function shareTextFor(result){
  const {s,catLabel,brandName,params}=result;
  const details=parameterLines(s,params);
  return [`今天想喝：${s.name}`,`${catLabel} · ${brandName} · ¥${s.price}`,...details].join('\n');
}
function roundedPath(ctx,x,y,w,h,r){
  const radius=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+radius,y);
  ctx.arcTo(x+w,y,x+w,y+h,radius);
  ctx.arcTo(x+w,y+h,x,y+h,radius);
  ctx.arcTo(x,y+h,x,y,radius);
  ctx.arcTo(x,y,x+w,y,radius);
  ctx.closePath();
}
function drawCover(ctx,img,x,y,w,h){
  const scale=Math.max(w/img.naturalWidth,h/img.naturalHeight);
  const sw=w/scale,sh=h/scale;
  const sx=(img.naturalWidth-sw)/2,sy=(img.naturalHeight-sh)/2;
  ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);
}
function wrapCanvasText(ctx,text,x,y,maxWidth,lineHeight,maxLines){
  const chars=[...String(text)];
  const lines=[];let line='';
  chars.forEach(char=>{
    const next=line+char;
    if(line && ctx.measureText(next).width>maxWidth){lines.push(line);line=char;}else line=next;
  });
  if(line) lines.push(line);
  const visible=lines.slice(0,maxLines);
  if(lines.length>maxLines){
    let last=visible[maxLines-1];
    while(last && ctx.measureText(last+'…').width>maxWidth) last=last.slice(0,-1);
    visible[maxLines-1]=last+'…';
  }
  visible.forEach((value,index)=>ctx.fillText(value,x,y+index*lineHeight));
  return y+visible.length*lineHeight;
}
function loadCardImage(src){
  return new Promise(resolve=>{
    if(!src){resolve(null);return;}
    const img=new Image();
    img.crossOrigin='anonymous'; // 图床直链（如肯悦）已开 CORS，允许画进分享卡；同源本地图不受影响
    img.onload=()=>resolve(img);img.onerror=()=>resolve(null);img.src=src;
  });
}
async function prepareShareCard(result){
  const {s,catLabel,brandName,params}=result;
  const canvas=document.createElement('canvas');
  canvas.width=900;canvas.height=1200;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#f4f8ff';ctx.fillRect(0,0,900,1200);

  ctx.fillStyle='#17324d';ctx.font='700 30px system-ui, sans-serif';
  ctx.fillText('今天想喝这杯',70,82);
  ctx.fillStyle='#e11d48';ctx.font='34px system-ui, sans-serif';ctx.fillText('♥',798,82);

  // file:// 下本地图片会污染 Canvas；线上同源部署时使用真实饮品图。
  const img=location.protocol==='file:'?null:await loadCardImage(s.img);
  roundedPath(ctx,70,130,760,520,38);ctx.save();ctx.clip();
  if(img) drawCover(ctx,img,70,130,760,520);
  else {ctx.fillStyle='#dbeafe';ctx.fillRect(70,130,760,520);ctx.font='150px system-ui';ctx.textAlign='center';ctx.fillText(DATA_emo(catLabel),450,440);ctx.textAlign='left';}
  ctx.restore();

  ctx.fillStyle='#2563eb';ctx.font='700 24px system-ui, sans-serif';
  ctx.fillText(`${catLabel} · ${brandName}`,70,712);
  ctx.fillStyle='#17324d';ctx.font='800 52px system-ui, sans-serif';
  let y=wrapCanvasText(ctx,s.name,70,780,600,64,2);
  ctx.fillStyle='#2563eb';ctx.font='800 46px system-ui, sans-serif';ctx.fillText(`¥${s.price}`,710,780);

  const details=parameterLines(s,params).slice(0,4);
  if(details.length){
    y=Math.max(y+10,890);
    ctx.fillStyle='#ffffff';roundedPath(ctx,70,y-44,760,Math.max(88,details.length*38+30),24);ctx.fill();
    ctx.fillStyle='#526a82';ctx.font='500 25px system-ui, sans-serif';
    details.forEach((line,index)=>ctx.fillText(line,100,y+index*38));
  }

  ctx.fillStyle='#526a82';ctx.font='500 23px system-ui, sans-serif';ctx.fillText('饮料推荐系统 · 今天就喝这杯',70,1120);
  ctx.fillStyle='#2563eb';roundedPath(ctx,70,1150,140,8,4);ctx.fill();

  const blob=await new Promise((resolve,reject)=>canvas.toBlob(value=>value?resolve(value):reject(new Error('Canvas export failed')),'image/png'));
  const safeName=s.name.replace(/[\\/:*?"<>|]/g,'-');
  return new File([blob],`${safeName}-饮品卡片.png`,{type:'image/png'});
}
async function copyOrderText(text){
  try{
    if(navigator.clipboard && window.isSecureContext){await navigator.clipboard.writeText(text);return true;}
  }catch(_){}
  const area=document.createElement('textarea');
  area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();
  const copied=document.execCommand('copy');area.remove();return copied;
}
async function fallbackShare(text){
  if(activeShareFile){
    const url=URL.createObjectURL(activeShareFile);
    const link=document.createElement('a');link.href=url;link.download=activeShareFile.name;document.body.appendChild(link);link.click();link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  const copied=await copyOrderText(text);
  shareStatus=activeShareFile?(copied?'分享卡片已保存，订单文字已复制':'分享卡片已保存'):(copied?'订单文字已复制':'暂时无法分享，请截图发送');
  renderResultCard();
}
async function shareResultCard(){
  if(!activeResult) return;
  const text=shareTextFor(activeResult);
  if(activeShareFile && navigator.share){
    const payload={title:`今天想喝：${activeResult.s.name}`,text,files:[activeShareFile]};
    const canShare=!navigator.canShare || navigator.canShare({files:payload.files});
    if(canShare){
      try{
        await navigator.share(payload);
        shareStatus='已经发出啦 ✓';renderResultCard();return;
      }catch(error){
        if(error && error.name==='AbortError') return;
      }
    }
  }
  await fallbackShare(text);
}
function DATA_emo(label){return label==='咖啡'?'☕':label==='奶茶'?'🥤':'🍹';}
function closeResult(){$('overlay').classList.remove('show');}

function randomCandidates(){
  if(state.cat && state.brand) return catalog.filter(entry=>entry.catKey===state.cat && entry.brandKey===state.brand);
  if(state.cat) return catalog.filter(entry=>entry.catKey===state.cat);
  return catalog;
}

function surprise(){
  // 当前范围内每个 SKU 等概率；候选足够时避开最近 5 次随机结果。
  const all=randomCandidates();
  const fresh=all.filter(entry=>!recentRandom.includes(entry.key));
  const pool=fresh.length ? fresh : all;
  const entry=pool[Math.floor(Math.random()*pool.length)];
  const {s:sku,catKey:cat,brandKey:brand}=entry;
  recentRandom=[entry.key,...recentRandom.filter(key=>key!==entry.key)].slice(0,5);
  const params={};
  groupsFor(sku).forEach(k=>{
    const g=resolveGroup(sku, k);
    if(g.multi){
      const n=Math.floor(Math.random()*3); // 随机 0~2 样加料
      const pool=[...g.items].sort(()=>Math.random()-0.5);
      params[k]=pool.slice(0,n);
    } else {
      params[k]=g.items[Math.floor(Math.random()*g.items.length)];
    }
  });
  showResult(sku, entry.catLabel, entry.brandName, true, params, cat, brand);
}

function fillSearchFilters(){
  $('filterCat').innerHTML='<option value="">全部品类</option>'+Object.entries(DATA).map(([key,cat])=>`<option value="${key}">${cat.label}</option>`).join('');
  refreshBrandFilter();
}
function refreshBrandFilter(){
  const catKey=$('filterCat').value;
  const current=$('filterBrand').value;
  const brands=new Map();
  catalog.filter(entry=>!catKey || entry.catKey===catKey).forEach(entry=>brands.set(entry.brandKey,entry.brandName));
  $('filterBrand').innerHTML='<option value="">全部品牌</option>'+[...brands].map(([key,name])=>`<option value="${key}">${name}</option>`).join('');
  if(brands.has(current)) $('filterBrand').value=current;
}
function renderSearchResults(){
  const q=$('searchInput').value.trim().toLocaleLowerCase();
  const catKey=$('filterCat').value;
  const brandKey=$('filterBrand').value;
  const maxPrice=Number($('filterPrice').value || Infinity);
  const sort=$('filterSort').value;
  let matches=catalog.filter(entry=>(
    (!q || `${entry.s.name} ${entry.brandName}`.toLocaleLowerCase().includes(q)) &&
    (!catKey || entry.catKey===catKey) && (!brandKey || entry.brandKey===brandKey) && Number(entry.s.price)<=maxPrice
  ));
  if(sort==='priceAsc') matches=[...matches].sort((a,b)=>Number(a.s.price)-Number(b.s.price));
  if(sort==='priceDesc') matches=[...matches].sort((a,b)=>Number(b.s.price)-Number(a.s.price));
  $('searchCount').textContent=`共 ${matches.length} 杯`;
  const box=$('searchResults');box.innerHTML='';
  if(!matches.length){box.innerHTML='<div class="empty">没有找到符合条件的饮品</div>';return;}
  const frag=document.createDocumentFragment();
  matches.forEach(entry=>frag.appendChild(renderDrinkRow(entry,true)));
  box.appendChild(frag);
}
function openSearch(){
  renderSearchResults();
  $('searchOverlay').classList.add('show');
  setTimeout(()=>$('searchInput').focus(),50);
}
function closeSearch(){$('searchOverlay').classList.remove('show');}

let libraryMode='favorites';
function setLibraryMode(mode){
  libraryMode=mode;
  const isFavorites=mode==='favorites';
  $('favoritesTab').classList.toggle('on',isFavorites);
  $('historyTab').classList.toggle('on',!isFavorites);
  $('favoritesTab').setAttribute('aria-selected',String(isFavorites));
  $('historyTab').setAttribute('aria-selected',String(!isFavorites));
  renderLibrary();
}
function renderLibrary(){
  const keys=libraryMode==='favorites'?[...favorites].reverse():history;
  const entries=keys.map(key=>catalogByKey.get(key)).filter(Boolean);
  const box=$('libraryList');box.innerHTML='';
  if(!entries.length){
    box.innerHTML=`<div class="empty">${libraryMode==='favorites'?'还没有收藏的饮品':'还没有最近记录'}</div>`;
  }else{
    const frag=document.createDocumentFragment();
    entries.forEach(entry=>frag.appendChild(renderDrinkRow(entry,true)));
    box.appendChild(frag);
  }
  $('clearHistoryBtn').style.display=libraryMode==='history' && history.length?'block':'none';
}
function openLibrary(){setLibraryMode('favorites');$('libraryOverlay').classList.add('show');}
function closeLibrary(){$('libraryOverlay').classList.remove('show');}

function burst(){
  const box=$('confetti');box.innerHTML='';
  const emo=['✨','💕','🎉','🌸','💖','⭐','🍓'];
  for(let i=0;i<18;i++){
    const s=document.createElement('span');
    s.textContent=emo[Math.floor(Math.random()*emo.length)];
    s.style.left=Math.random()*100+'%';
    s.style.animationDuration=(1.2+Math.random()*1.2)+'s';
    s.style.animationDelay=(Math.random()*0.3)+'s';
    box.appendChild(s);
  }
  setTimeout(()=>box.innerHTML='',2600);
}

$('surpriseBtn').onclick=surprise;
$('resetBtn').onclick=()=>{state.cat=null;state.brand=null;closeResult();render();};
$('customOverlay').addEventListener('click', e=>{ if(e.target===$('customOverlay')) closeCustom(); });
$('searchBtn').onclick=openSearch;
$('libraryBtn').onclick=openLibrary;
$('closeSearchBtn').onclick=closeSearch;
$('closeLibraryBtn').onclick=closeLibrary;
$('searchInput').oninput=renderSearchResults;
$('filterCat').onchange=()=>{refreshBrandFilter();renderSearchResults();};
$('filterBrand').onchange=renderSearchResults;
$('filterPrice').onchange=renderSearchResults;
$('filterSort').onchange=renderSearchResults;
$('favoritesTab').onclick=()=>setLibraryMode('favorites');
$('historyTab').onclick=()=>setLibraryMode('history');
$('clearHistoryBtn').onclick=()=>{history=[];writeList(STORAGE.history,history);renderLibrary();};
$('searchOverlay').addEventListener('click',e=>{if(e.target===$('searchOverlay')) closeSearch();});
$('libraryOverlay').addEventListener('click',e=>{if(e.target===$('libraryOverlay')) closeLibrary();});
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay')) closeResult();});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if($('customOverlay').classList.contains('show')) closeCustom();
  else if($('overlay').classList.contains('show')) closeResult();
  else if($('searchOverlay').classList.contains('show')) closeSearch();
  else if($('libraryOverlay').classList.contains('show')) closeLibrary();
});
fillSearchFilters();
updateLibraryIcon();
render();
</script>
